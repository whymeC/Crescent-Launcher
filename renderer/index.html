<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crescent</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="renderer.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M19 14.5A8 8 0 1 1 9.5 5a6.5 6.5 0 0 0 9.5 9.5z"/></svg>
        <span>CRESCENT</span>
      </div>
      <div class="tb-nav">
        <button id="tb-back" class="icon-btn" type="button" aria-label="Back" data-icon="back"></button>
        <button id="tb-fwd" class="icon-btn" type="button" aria-label="Forward" data-icon="fwd"></button>
      </div>
      <div id="crumb" class="crumb">Your launcher. Your universe.</div>
      <label class="search">
        <span data-icon="search"></span>
        <input id="search" type="search" placeholder="Search your library" autocomplete="off" />
        <kbd>Ctrl K</kbd>
      </label>
      <button id="bell" class="icon-btn" type="button" aria-label="Launcher updates" data-icon="bell"></button>
      <div id="win-ctl" class="win-ctl">
        <button id="win-min" class="icon-btn" type="button" aria-label="Minimize" data-icon="min"></button>
        <button id="win-max" class="icon-btn" type="button" aria-label="Maximize" data-icon="max"></button>
        <button id="win-close" class="icon-btn close" type="button" aria-label="Close" data-icon="close"></button>
      </div>
    </header>

    <nav class="sidebar" aria-label="Main">
      <div class="side-label">Your space</div>
      <button class="side-item" type="button" data-route="home" data-icon="home">Home</button>
      <button class="side-item" type="button" data-route="library" data-icon="library">Library</button>
      <button class="side-item" type="button" data-route="downloads" data-icon="download">Downloads <span id="dl-count" class="count" hidden></span></button>
      <div class="side-label quick-label">Quick launch</div>
      <div id="quick" class="quick"></div>
      <div class="side-bottom">
        <button class="side-item" type="button" data-route="account" data-icon="settings">Settings</button>
        <button id="account-card" class="account-card" type="button" data-route="account">
          <span id="acc-avatar" class="avatar"></span>
          <span><b id="acc-name"></b><small>My account</small></span>
        </button>
      </div>
    </nav>

    <main class="main">
      <div id="update-banner" class="update-banner" role="status" hidden>
        <span id="update-text"></span>
        <button id="update-restart" class="btn light small" type="button" hidden>Restart to update</button>
      </div>
      <div id="page" class="page"></div>
    </main>

    <aside class="friends" aria-label="Friends">
      <div class="f-head"><h2>Friends</h2></div>
      <div class="f-empty">
        <p>Friends and chat aren't connected yet.</p>
        <small>This panel is ready for an online service to plug into.</small>
      </div>
    </aside>

    <footer class="statusbar">
      <span id="sb-left"></span>
      <span id="sb-mid"></span>
      <span id="sb-right"></span>
    </footer>
  </div>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
