<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data: blob: crescent:; media-src 'self' blob: crescent:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crescent</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="ui.js" defer></script>
  <script src="renderer.js" defer></script>
</head>
<body>
  <div id="wallpaper" class="wallpaper" aria-hidden="true"></div>

  <div class="shell" id="shell">
    <header class="titlebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M19 14.5A8 8 0 1 1 9.5 5a6.5 6.5 0 0 0 9.5 9.5z"/></svg>
        <span>CRESCENT</span>
      </div>
      <div class="tb-nav">
        <button id="tb-back" class="icon-btn" type="button" aria-label="Back" data-icon="back"></button>
        <button id="tb-fwd" class="icon-btn" type="button" aria-label="Forward" data-icon="fwd"></button>
      </div>
      <div id="crumb" class="crumb">Your launcher. Your universe.</div>
      <label class="search">
        <span data-icon="search"></span>
        <input id="search" type="search" placeholder="Search your library" autocomplete="off" />
        <kbd>Ctrl K</kbd>
      </label>
      <button id="update-pill" class="update-pill" type="button" hidden></button>
      <div class="bell-wrap">
        <button id="bell" class="icon-btn" type="button" aria-label="Messages" aria-haspopup="true" data-icon="bell"></button>
        <div id="bell-menu" class="bell-menu" hidden></div>
      </div>
      <div id="win-ctl" class="win-ctl">
        <button id="win-min" class="icon-btn" type="button" aria-label="Minimize" data-icon="min"></button>
        <button id="win-max" class="icon-btn" type="button" aria-label="Maximize or restore" data-icon="max"></button>
        <button id="win-close" class="icon-btn close" type="button" aria-label="Close" data-icon="close"></button>
      </div>
    </header>

    <nav class="sidebar" aria-label="Main">
      <div class="side-label">Your space</div>
      <button class="side-item" type="button" data-route="home" data-icon="home">Home</button>
      <button class="side-item" type="button" data-route="library" data-icon="library">Library</button>
      <button class="side-item" type="button" data-route="downloads" data-icon="download">Downloads <span id="dl-count" class="count" hidden></span></button>
      <div class="side-label quick-label">Quick launch</div>
      <div id="quick" class="quick"></div>
      <div class="side-bottom">
        <button class="side-item" type="button" data-route="settings" data-icon="settings">Settings</button>
        <button id="account-card" class="account-card" type="button" data-route="account">
          <span id="acc-bg" class="acc-bg" aria-hidden="true"></span>
          <span class="acc-in">
            <span id="acc-avatar" class="avatar"></span>
            <span><b id="acc-name"></b><small>My account</small></span>
          </span>
        </button>
      </div>
    </nav>

    <main class="main">
      <button id="friends-show" class="friends-show" type="button" aria-label="Show friends list" title="Show friends list" data-icon="showFriends"></button>
      <div id="page" class="page"></div>
    </main>

    <aside class="friends" aria-label="Friends">
      <div class="f-head">
        <h2>Friends</h2>
        <button id="friends-hide" class="icon-btn" type="button" aria-label="Hide friends list" title="Hide friends list" data-icon="hideFriends"></button>
      </div>
      <div class="f-empty">
        <p>Friends and chat aren't connected yet.</p>
        <small>This panel is ready for an online service to plug into.</small>
      </div>
    </aside>

    <footer class="statusbar">
      <span id="sb-left"></span>
      <span id="sb-mid"></span>
      <span id="sb-right"></span>
    </footer>
  </div>

  <div id="loader" class="loader" role="status">
    <div class="loader-inner">
      <div id="loader-moons"></div>
      <p id="loader-text">Looking for your games…</p>
    </div>
  </div>
  <div id="popups" class="popups" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
