<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Crescent overlay</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font: 600 13px "Segoe UI", system-ui, sans-serif; color: #fff; }
    .box { display: inline-grid; grid-template-columns: auto auto; gap: 3px 14px; margin: 8px; padding: 9px 13px; border-radius: 10px; background: rgba(10, 11, 13, 0.72); border: 1px solid rgba(255, 255, 255, 0.14); text-shadow: 0 1px 2px #000; }
    .k { color: #9aa3b5; font-weight: 500; }
    .v { text-align: right; font-variant-numeric: tabular-nums; }
    .hot { color: #ff8d8d; }
  </style>
  <script src="overlay.js" defer></script>
</head>
<body>
  <div class="box" id="box"></div>
</body>
</html>
